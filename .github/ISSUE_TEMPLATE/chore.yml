name: Chore
description: Maintenance, refactoring, or housekeeping work
title: "[CHORE] "
type: "Chore"
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear description of the refactoring or maintenance work.
    validations:
      required: true

  - type: input
    id: motivation
    attributes:
      label: Motivation
      description: Why is this chore necessary? What problem does it solve or prevent?
    validations:
      required: true

  - type: textarea
    id: work_to_be_done
    attributes:
      label: Work to be done
      placeholder: "1. ...\n2. ...\n3. ..."