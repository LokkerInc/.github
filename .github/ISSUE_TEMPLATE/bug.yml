name: Bug
description: Report something that is broken or not behaving as expected
title: "[BUG] "
type: "Bug"
body:
  - type: markdown
    attributes:
      value: "## 🐛 Bug Report"

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear description of the bug.
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### Impacts"

  - type: input
    id: system
    attributes:
      label: System / Product
      placeholder: "e.g. Dashboard, API, Mobile"

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Production, Staging, Local"

  - type: input
    id: url
    attributes:
      label: URL (if applicable)
      placeholder: "https://..."

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Screenshots, console errors, or log output.
