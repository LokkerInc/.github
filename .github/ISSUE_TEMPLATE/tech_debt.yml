name: Tech Debt
description: Known shortcuts, outdated patterns, or code quality issues that need to be addressed
title: "[TECH DEBT] "
type: "Tech Debt"
body:
  - type: markdown
    attributes:
      value: "## 🏚️ Tech Debt"

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear description of the debt being addressed.
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current State
      description: "Describe the existing implementation and why it is problematic (e.g. fragile, hard to maintain, blocks future work, security concern)."
    validations:
      required: true

  - type: textarea
    id: desired_state
    attributes:
      label: Desired State
      description: Describe what good looks like after this debt is resolved.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact of Not Addressing
      placeholder: "- ..."

  - type: textarea
    id: work_to_be_done
    attributes:
      label: Work to be Done
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      placeholder: "- [ ] ..."
    validations:
      required: true
