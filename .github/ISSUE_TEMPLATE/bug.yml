name: Bug
description: Report something that is broken or not behaving as expected
title: "[BUG] "
type: "Bug"
projects:
  - LokkerInc/16
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear description of the bug.
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System / Product
      placeholder: "e.g. dashboard, database, API"

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL where this reproduces
      placeholder: "https://..."

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "Description of what should happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "Description of what actually happens."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."

  - type: textarea
    id: screenshots
    attributes:
      label: Additional screenshots / logs
      placeholder: "Screenshots, console errors, or log output."
