name: User Story
description: A feature or capability described from the user's perspective
title: "[STORY] "
type: "User Story"
body:
  - type: markdown
    attributes:
      value: "## 👤 User Story"

  - type: textarea
    id: story
    attributes:
      label: User Story
      placeholder: "As a [type of user], I want [some goal or capability], so that [some reason or benefit]."
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: Goals
      placeholder: "- ..."

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out Of Scope
      placeholder: "- ..."

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      placeholder: "Given [some context or precondition]\nWhen  [some action is taken]\nThen  [some outcome is expected]"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Screenshots, links to wireframes or designs, etc.
